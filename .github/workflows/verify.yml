name: DRAC verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-exhaust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e . pytest

      - name: Unit tests
        run: pytest -q

      - name: Exhaustive finite verification
        run: python scripts/run_exhaustive.py --max-worlds 4 --max-experiments 2 --cap 100000

      - name: Show result
        run: cat results/exhaustive_summary.json

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drac-verification-results
          path: results/
